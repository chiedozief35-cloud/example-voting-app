name: Capstone CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

env:
  COMPOSE_PROJECT_NAME: capstone-ci
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres

jobs:
  build-test-scan-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate temporary test database password
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf 'POSTGRES_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start application
        run: |
          docker compose up --build --detach \
            --wait --wait-timeout 180 \
            vote result worker redis db

      - name: Run voting smoke tests
        run: bash scripts/smoke-test.sh

      - name: Tag tested images with commit SHA
        id: images
        shell: bash
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"

          for service in vote result worker; do
            docker tag \
              "capstone-ci-$service" \
              "$prefix-$service:$GITHUB_SHA"
          done

      - name: Scan vote image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ steps.images.outputs.prefix }}-vote:${{ github.sha }}"
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan result image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ steps.images.outputs.prefix }}-result:${{ github.sha }}"
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ steps.images.outputs.prefix }}-worker:${{ github.sha }}"
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned images
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
        run: |
          for service in vote result worker; do
            docker push "$IMAGE_PREFIX-$service:$GITHUB_SHA"
          done

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Remove temporary test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
