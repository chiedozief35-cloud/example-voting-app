{{- range $name, $port := dict "redis" 6379 "db" 5432 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: {{ $name }}
      port: {{ $port }}
      targetPort: {{ $port }}
{{- end }}
