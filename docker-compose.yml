# version is now using "compose spec"
# v2 and v3 are now combined!
# docker-compose v1.27+ required

services:
  vote:
    build:
      context: ./vote
      target: final
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - front-tier
      - back-tier

  result:
    build:
      context: ./result
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Required}"
      POSTGRES_DB: "${POSTGRES_DB:?Required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Required}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - front-tier
      - back-tier

  worker:
    build:
      context: ./worker
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Required}"
      POSTGRES_DB: "${POSTGRES_DB:?Required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Required}"
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    networks:
      - back-tier

  redis:
    image: redis@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: postgres@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Required}"
      POSTGRES_DB: "${POSTGRES_DB:?Required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Required}"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

  # this service runs once to seed the database with votes
  # it won't run unless you specify the "seed" profile
  # docker compose --profile seed up -d
  seed:
    build: ./seed-data
    profiles: ["seed"]
    depends_on:
      vote:
        condition: service_healthy 
    networks:
      - front-tier
    restart: "no"

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
